<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criativo Feed - Taiobeiras</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      display: flex;
      flex-direction: column;
      font-family: 'Outfit', sans-serif;
    }
    .creative {
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      width: 1080px;
      height: 1080px;
    }
    
    .bg-gradient-custom {
      background: radial-gradient(circle at top left, #164e63 0%, #0f172a 60%, #000 100%);
    }
    
    .glow-circle {
      position: absolute;
      width: 800px;
      height: 800px;
      border-radius: 50%;
      filter: blur(150px);
      opacity: 0.2;
      z-index: 1;
    }

    .speech-balloon {
      position: relative;
      background: rgba(15, 23, 42, 0.4);
      border: 1px solid rgba(34, 211, 238, 0.3);
      border-radius: 3.5rem;
      padding: 3rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      z-index: 10;
    }
    
    .tail-bottom-right { border-bottom-right-radius: 0; }

    .info-bar-feed {
      display: flex;
      justify-content: space-around;
      align-items: center;
      width: 100%;
      padding: 1.2rem 1rem;
      border-radius: 1.5rem;
      margin-top: auto;
      z-index: 50;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .info-item { display: flex; align-items: center; gap: 0.8rem; }
    .info-icon { font-size: 1.3rem; opacity: 0.8; }
    .info-text { display: flex; flex-direction: column; }
    .info-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      color: #94a3b8;
      letter-spacing: 0.1em;
      font-weight: 500;
      margin-bottom: 2px;
    }
    .info-value {
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 0.5rem;
      z-index: 50;
    }

    .text-gradient-cyan {
      background: linear-gradient(135deg, #22d3ee 0%, #06b6d4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body>

  <div id="creative-taiobeiras" class="creative bg-gradient-custom text-white p-14">
    <div class="glow-circle" style="top: -10%; right: -10%; background: #06b6d4;"></div>
    <div class="top-bar">
      <img src="./Arquivos/LogoDéioOratóriaSemFundo.png" alt="Logo" class="h-16 opacity-90">
      <div class="px-5 py-1.5 rounded-full border border-cyan-500/30 bg-cyan-500/10 text-[0.7rem] uppercase tracking-widest font-bold text-cyan-400">Evento Presencial</div>
    </div>
    <div class="flex-1 relative mt-6">
      <div class="speech-balloon tail-bottom-right w-[620px] absolute top-8 left-0">
        <p class="text-2xl font-light uppercase tracking-[0.2em] text-slate-400 mb-2">Curso de Oratória</p>
        <h1 class="text-5xl font-black uppercase leading-[1.1] tracking-tight">
          Comunicação de<br/>
          <span class="text-gradient-cyan">Alto Impacto</span>
        </h1>
      </div>
      <img src="./Arquivos/Fotos Délio/foto-delio-01_no_bg.png" alt="Délio" class="absolute bottom-0 right-[-50px] h-[880px] object-contain" style="z-index: 20; -webkit-mask-image: linear-gradient(to top, transparent 0%, black 15%);">
    </div>
    <div class="info-bar-feed">
      <div class="info-item"><div class="info-icon">📅</div><div class="info-text"><span class="info-label">Data</span><span class="info-value">12 de Junho</span></div></div>
      <div class="w-px h-8 bg-white/10"></div>
      <div class="info-item"><div class="info-icon">🕒</div><div class="info-text"><span class="info-label">Horário</span><span class="info-value">8h da manhã</span></div></div>
      <div class="w-px h-8 bg-white/10"></div>
      <div class="info-item"><div class="info-icon">📍</div><div class="info-text"><span class="info-label">Local</span><span class="info-value">Auditório Hospital Santo Antônio - Taiobeiras</span></div></div>
    </div>
  </div>

</body>
</html>
